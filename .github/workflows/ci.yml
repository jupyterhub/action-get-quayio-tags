name: Continuous Integration

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test-javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-test
        run: npm run test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Test Local Action
        id: test-action
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#example-using-an-action-in-the-same-repository-as-the-workflow-at-the-running-commit-recommended
        # Resolves to the current commit, no checkout required
        uses: $/
        with:
          repository: jupyterhub/jupyterhub
          # This is an old release, so won't be updated
          version: '5.2.0'

      - name: Check output # zizmor: ignore[template-injection]
        run: |
          if [ "${{ steps.test-action.outputs.tags }}" != "[]" ]; then
            echo "ERROR: ${{ steps.test-action.outputs.tags }} != []"
            exit 1
          fi
          if [ "${{ steps.test-action.outputs.buildNumber }}" != "0" ]; then
            echo "ERROR: ${{ steps.test-action.outputs.buildNumber }} != 0"
            exit 1
          fi

      - name: Check environment output
        run: |
          if [ "$GET_QUAYIO_TAGS_TAGS" != "[]" ]; then
            echo "ERROR: $GET_QUAYIO_TAGS_TAGS != []"
            exit 1
          fi
          if [ "$GET_QUAYIO_TAGS_BUILDNUMBER" != "0" ]; then
            echo "ERROR: $GET_QUAYIO_TAGS_BUILDNUMBER != 0"
            exit 1
          fi
